{% extends "base.html" %}
{% block content %}
<div class="heading">
  <div>
    <h1>Geburtschart: {{ profile.name }}</h1>
    <p>{{ profile.birth_local.strftime("%d.%m.%Y, %H:%M:%S") }} · {{ profile.timezone }} · {{ profile.place }}</p>
  </div>
  <div class="actions">
    <a href="/profiles">Zur Profilübersicht</a>
    <a href="/profiles/{{ profile.id }}/edit">Profil bearbeiten</a>
    <form method="post" action="/profiles/{{ profile.id }}/chart">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="refresh" value="1">
      <button type="submit">Neu berechnen</button>
    </form>
  </div>
</div>
<img class="profile-chart-large" src="/profiles/{{ profile.id }}/chart.svg"
     alt="Human Design BodyGraph für {{ profile.name }}">
{% endblock %}
