{% extends "base.html" %}

{% block content %}
<section class="transit-bodygraph" aria-label="Aktueller Transit-BodyGraph">
  <a class="transit-time" href="/"><time datetime="{{ frame.timestamp_utc.isoformat() }}">{{ frame.timestamp_utc.strftime("%d.%m.%Y %H:%M:%S") }} UTC</time></a>
