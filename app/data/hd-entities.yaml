  - {id: perspective.wanting, name: Wollen, description: "Ein Perspektivbegriff für Aufmerksamkeit auf Gewünschtes oder Fehlendes; nicht mit der Motivationskategorie gleichzusetzen.", provenance: *ai}
  - {id: perspective.probability, name: Wahrscheinlichkeit, description: "Ein Perspektivbegriff für erwartbare Entwicklungen. Er verleiht keine statistisch nachgewiesene Prognosefähigkeit.", provenance: *ai}
  - {id: perspective.personal, name: Persönlich, description: "Ein Perspektivbegriff für den Bezug zur eigenen Erfahrung, keine Behauptung von Egoismus.", provenance: *ai}
  - {id: motivation.fear, name: Angst, description: "Ein systeminterner Motivationsname, der mit Erkundung und Absicherung verbunden wird; keine Diagnose von Ängstlichkeit.", provenance: *ai}
  - {id: motivation.hope, name: Hoffnung, description: "Ein Motivationsbegriff für das Offenhalten eines möglichen guten Verlaufs, nicht für dessen garantierten Eintritt.", provenance: *ai}
  - {id: motivation.desire, name: Verlangen, description: "Ein Motivationsbegriff für Veränderungswünsche und Beteiligung; die Kategorie beweist kein konkretes persönliches Begehren.", provenance: *ai}
  - {id: motivation.need, name: Bedürfnis, description: "Ein Motivationsbegriff für Aufmerksamkeit auf das Erforderliche. Tatsächliche Bedürfnisse müssen unabhängig vom Chart geklärt werden.", provenance: *ai}
  - {id: motivation.guilt, name: Schuld, description: "Ein traditioneller Kategoriename, hier als Reflexion über Verantwortung und Verbesserung verstanden; keine moralische Schuldzuweisung.", provenance: *ai}
  - {id: motivation.innocence, name: Unschuld, description: "Ein Motivationsbegriff für Beteiligung ohne festes Veränderungsziel, kein Urteil über moralischen Wert.", provenance: *ai}
  - {id: cognition.smell, name: Geruch, description: "Eine traditionelle Kognitionskategorie. Sie belegt weder besondere Riechleistung noch eine medizinische Sinnesfunktion.", provenance: *ai}
  - {id: cognition.taste, name: Geschmack, description: "Eine traditionelle Kognitionskategorie, zu unterscheiden von der gleichnamigen Determination-Color.", provenance: *ai}
  - {id: cognition.outer-vision, name: Äußeres Sehen, description: "Eine systeminterne Kategorie mit Bezug auf visuelle Eindrücke, kein Ergebnis einer Sehprüfung.", provenance: *ai}
  - {id: cognition.inner-vision, name: Inneres Sehen, description: "Eine systeminterne Kategorie mit Bezug auf innere Vorstellungen, keine Behauptung übersinnlicher Wahrnehmung.", provenance: *ai}
  - {id: cognition.feeling, name: Fühlen, description: "Ein traditioneller Kognitionsname. Er ist nicht automatisch mit emotionaler Autorität oder einem medizinischen Tastsinn gleichzusetzen.", provenance: *ai}
  - {id: cognition.touch, name: Berühren, description: "Eine traditionelle Kognitionskategorie mit Bezug auf Kontakt. Der Kategoriename allein belegt keine besondere sensorische Fähigkeit.", provenance: *ai}
