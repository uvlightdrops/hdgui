[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hdgui"
version = "0.1.0"
description = "Local Human Design profile storage and chart viewer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.18,<1",
    "itsdangerous>=2.2,<3",
    "defusedxml>=0.7,<1",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "data/*.json", "data/*.yaml", "data/NOTICE", "data/LICENSE-AGPL"]
